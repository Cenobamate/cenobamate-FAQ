name: Confirm and Push

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  confirm-and-push:
    runs-on: ubuntu-latest
    # 只有当评论包含"确认推送"且 Issue 标题以 [待确认] 开头时才执行
    if: |
      contains(github.event.comment.body, '确认推送') &&
      startsWith(github.event.issue.title, '[待确认]')

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pending-papers.json from pending branch
        run: |
          git fetch origin pending
          git checkout origin/pending -- pending-papers.json
          echo "✅ 已从 pending 分支获取 pending-papers.json"

      - name: Merge pending papers into literature-data.json
        id: merge
        run: python .github/scripts/merge_papers.py
        env:
          PENDING_FILE: pending-papers.json
          LITERATURE_FILE: literature-data.json

      - name: Commit merged literature-data.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add literature-data.json
          git commit -m "Update literature-data.json — add ${{ steps.merge.outputs.paper_count }} new papers ($(TZ=Asia/Shanghai date '+%Y-%m-%d'))" || echo "No changes to commit"
          git push origin main

      - name: Delete pending-papers.json from pending branch
        run: |
          git checkout pending
          git rm -f pending-papers.json pending_papers_list.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Clear pending papers after push" || echo "No changes to commit"
          git push origin pending
          git checkout main

      - name: Update Issue title and close
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAPER_COUNT: ${{ steps.merge.outputs.paper_count }}
        run: |
          # 更新 Issue 标题
          OLD_TITLE="${{ github.event.issue.title }}"
          NEW_TITLE="${OLD_TITLE/\[待确认\]/[已推送]}"
          curl -s -X PATCH \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER" \
            -d "{\"title\": \"$NEW_TITLE\", \"state\": \"closed\"}"

          # 添加确认评论
          curl -s -X POST \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -d "{\"body\": \"✅ 已推送 $PAPER_COUNT 篇文献到文献速查页面\n\n查看更新: [literature-data.json](https://github.com/$REPO/blob/main/literature-data.json)\"}"

          echo "✅ Issue 已更新并关闭"
